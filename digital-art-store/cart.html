<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Digital Art Store - Cart</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="scripts.js"></script>
</head>
<body class="bg-gray-50 font-montserrat text-gray-800">
  <header class="bg-white shadow">
    <div class="container mx-auto px-6 py-4 flex justify-between items-center">
      <a href="index.html" class="text-2xl font-bold text-indigo-600">Digital Art Store</a>
      <nav class="space-x-6 text-gray-600">
        <a href="index.html" class="hover:text-indigo-600 transition">Home</a>
        <a href="products.html" class="hover:text-indigo-600 transition">Products</a>
        <a href="cart.html" class="hover:text-indigo-600 transition">
          <i class="fas fa-shopping-cart"></i> Cart
        </a>
      </nav>
    </div>
  </header>

  <main class="container mx-auto px-6 py-10">
    <h1 class="text-4xl font-extrabold mb-8">Your Shopping Cart</h1>
    <div id="cart-items" class="bg-white rounded-lg shadow p-6 max-w-4xl mx-auto">
      <!-- Cart items will be loaded here by JavaScript -->
      <p class="text-center text-gray-500">Your cart is empty.</p>
    </div>
    <div id="cart-summary" class="max-w-4xl mx-auto mt-6 text-right hidden">
      <p class="text-xl font-semibold">Total: $<span id="cart-total">0.00</span></p>
      <button id="checkout-btn" class="mt-4 px-6 py-3 bg-indigo-600 text-white rounded-lg shadow hover:bg-indigo-700 transition">Checkout</button>
    </div>
  </main>

  <footer class="bg-white border-t mt-20 py-6 text-center text-gray-600">
    &copy; 2024 Digital Art Store. All rights reserved.
  </footer>
</body>
</html>
